services:
  - type: web
    name: decormatrix-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_MODELS
        value: gemini-3.5-flash-lite,gemini-3.5-flash,gemini-3.1-flash-lite
      - key: GEMINI_TIMEOUT_SECONDS
        value: "15"
      - key: AI_RATE_LIMIT
        value: "20"
      - key: AI_RATE_WINDOW_SECONDS
        value: "300"
